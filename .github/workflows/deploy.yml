name: Production Zero-Downtime Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  ci-cd:
    name: Build, Test & Rolling Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: production-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd app
          # Build docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          # Push both commit SHA tag and latest tag
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger ASG Instance Refresh (Zero-Downtime Rollout)
        env:
          ASG_NAME: production-pipeline-asg
        run: |
          echo "Triggering zero-downtime instance refresh..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $(aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'production-pipeline')].AutoScalingGroupName" --output text) \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}'